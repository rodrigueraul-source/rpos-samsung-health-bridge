name: Android Samsung Build

on:
  push:
    branches:
      - bridge/**
  pull_request:

permissions:
  contents: read

jobs:
  samsung-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch pinned official Samsung Health Data SDK 1.1.0
        shell: bash
        run: |
          set -euo pipefail
          sdk_zip="$RUNNER_TEMP/samsung-health-data-sdk-1.1.0.zip"
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 120 \
            'https://developer.samsung.com/SHealth/file/f11b8b9d-8bd6-4e9d-9899-3711375a91bf' \
            --output "$sdk_zip"
          echo "7a51440d840e099769b150c6414365bc43eecb61c01fa5bf6d0e54e09c2b663f  $sdk_zip" | sha256sum --check --strict
          mkdir -p app/libs
          unzip -p "$sdk_zip" '1.1.0/libs/samsung-health-data-api-1.1.0.aar' > app/libs/samsung-health-data-api-1.1.0.aar
          echo 'f5d3d83cf00b97d0bb1b1db4da076e861eb1c3e6e704d89a34e68909d2f38654  app/libs/samsung-health-data-api-1.1.0.aar' | sha256sum --check --strict

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile real Samsung flavor
        run: gradle :app:assembleSamsungDebug :app:testSamsungDebugUnitTest --stacktrace

      - name: Verify APK signature and record build identity
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/samsung/debug/app-samsung-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          sha256sum "$apk" > app/build/outputs/apk/samsung/debug/SHA256SUMS.txt

      - name: Retain Samsung APK build evidence
        uses: actions/upload-artifact@v4
        with:
          name: rpos-bridge-samsung-debug
          path: |
            app/build/outputs/apk/samsung/debug/*.apk
            app/build/outputs/apk/samsung/debug/SHA256SUMS.txt
            app/build/outputs/apk/samsung/debug/output-metadata.json
          if-no-files-found: error
          retention-days: 7
