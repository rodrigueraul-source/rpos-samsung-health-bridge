name: Android Mock Build

on:
  push:
    branches:
      - main
      - bridge/**
  pull_request:

permissions:
  contents: read

jobs:
  mock-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile mock flavor
        run: gradle :app:assembleMockDebug --stacktrace

      - name: Retain mock APK build evidence
        uses: actions/upload-artifact@v4
        with:
          name: rpos-bridge-mock-debug
          path: app/build/outputs/apk/mock/debug/*.apk
          if-no-files-found: error
          retention-days: 7

